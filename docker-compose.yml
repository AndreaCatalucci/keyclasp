services:
  keyblind:
    build: .
    container_name: keyblind
    ports:
      - "3100:3100"
    volumes:
      - keyblind_data:/home/keyblind/.keyblind
      - ./:/workspace:ro
    environment:
      - KEYBLIND_AUTO_INIT=true
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  keyblind_data:
