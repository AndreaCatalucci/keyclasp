<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#0d1117"/>

  <!-- Subtle border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!-- Keyhole/shield icon -->
  <g transform="translate(120,95)">
    <!-- Shield outline -->
    <path d="M0,-50 L40,-30 L40,10 C40,35 15,55 0,62 C-15,55 -40,35 -40,10 L-40,-30 Z"
          fill="none" stroke="#58a6ff" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Keyhole circle -->
    <circle cx="0" cy="-10" r="8" fill="#58a6ff"/>

    <!-- Keyhole stem -->
    <rect x="-3.5" y="-2" width="7" height="20" rx="3.5" fill="#58a6ff"/>

    <!-- Inner dot -->
    <circle cx="0" cy="-10" r="3" fill="#0d1117"/>
  </g>

  <!-- Brand name -->
  <text x="120" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Key<span fill="#58a6ff">blind</span></text>

  <!-- Tagline -->
  <text x="120" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">Keep API keys out of agent context</text>
</svg>
