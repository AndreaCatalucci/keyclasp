<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 240px; height: 240px;
    background: #0d1117;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #f0f6fc;
  }
  .icon { font-size: 56px; margin-bottom: 12px; }
  .name { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .name span { color: #58a6ff; }
  .tag { font-size: 10px; color: #8b949e; margin-top: 4px; max-width: 200px; text-align: center; line-height: 1.3; }
</style>
</head>
<body>
  <div class="icon">🙈</div>
  <div class="name">Key<span>blind</span></div>
  <div class="tag">Keep API keys out of agent context</div>
</body>
</html>
