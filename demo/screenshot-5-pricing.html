<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1270, initial-scale=1.0">
  <title>Keyclasp — Open Source</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 95vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; }
  .card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 28px 24px; width: 280px; }
  .card.featured { border-color: #1f6feb; box-shadow: 0 0 0 1px #1f6feb; position: relative; }
  .card.featured::before { content: "Popular"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #1f6feb; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 12px; border-radius: 12px; }
  .card h3 { font-size: 20px; color: #f0f6fc; margin-bottom: 6px; }
  .card .price { font-size: 32px; font-weight: 700; color: #f0f6fc; margin-bottom: 2px; }
  .card .period { font-size: 13px; color: #8b949e; margin-bottom: 20px; }
  .card ul { list-style: none; margin-bottom: 20px; }
  .card li { padding: 5px 0; font-size: 13px; color: #c9d1d9; border-bottom: 1px solid #21262d; }
  .card li:last-child { border-bottom: 0; }
  .card li.yes::before { content: "✓ "; color: #3fb950; font-weight: 700; }
  .card li.no { color: #484f58; }
  .card li.no::before { content: "— "; color: #484f58; }
  .btn { display: block; text-align: center; padding: 10px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; }
  .btn-primary { background: #238636; color: #fff; border: 1px solid #2ea043; }
  .btn-outline { background: transparent; color: #58a6ff; border: 1px solid #30363d; }
  .coming-soon { display: block; text-align: center; padding: 10px; font-size: 13px; color: #8b949e; border: 1px dashed #30363d; border-radius: 8px; }
  .install { text-align: center; margin-top: 16px; color: #7ee787; font-size: 14px; font-family: 'Menlo', monospace; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Keyclasp — fully open source -->
  <div class="card" style="max-width: 400px; margin: 0 auto;">
    <h3>Keyclasp</h3>
    <div class="price">Free</div>
    <div class="period">open source</div>
    <ul>
      <li class="yes">Unlimited secrets</li>
      <li class="yes">Local AES-256-GCM vault</li>
      <li class="yes">Sandbox / Unsandbox</li>
      <li class="yes">Guarded command execution</li>
      <li class="yes">7 backends</li>
      <li class="yes">Audit log</li>
      <li class="yes">Secret rotation</li>
      <li class="yes">CI/CD integration</li>
      <li class="yes">TOTP 2FA</li>
      <li class="yes">Encrypted sharing</li>
      <li class="yes">Deterministic .env sandbox</li>
    </ul>
    <span class="install">npm install -g keyclasp</span>
  </div>
</div>
</body>
</html>
