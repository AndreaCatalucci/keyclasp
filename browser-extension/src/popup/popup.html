<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyblind</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      font-size: 13px;
    }
    .header {
      padding: 12px 16px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 16px; font-weight: 600; color: #58a6ff; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    }
    .status-dot.green { background: #3fb950; }
    .status-dot.red { background: #f85149; }
    .status-dot.yellow { background: #d29922; }
    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #21262d;
    }
    .section:last-child { border-bottom: none; }
    .section h2 {
      font-size: 12px;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .switch {
      position: relative;
      width: 36px; height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #30363d; border-radius: 20px;
      transition: 0.3s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background: white; border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider { background: #58a6ff; }
    input:checked + .slider:before { transform: translateX(16px); }
    .stat {
      display: flex; justify-content: space-between;
      padding: 3px 0;
    }
    .stat-label { color: #8b949e; }
    .stat-value { color: #c9d1d9; font-weight: 500; }
    .secret-count {
      font-size: 24px; font-weight: 700; color: #58a6ff;
    }
    .actions {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .btn {
      flex: 1; padding: 6px 8px;
      border: 1px solid #30363d; border-radius: 6px;
      background: #21262d; color: #c9d1d9;
      cursor: pointer; font-size: 11px; text-align: center;
      transition: background 0.2s;
    }
    .btn:hover { background: #30363d; }
    .btn.primary { background: #1f6feb; border-color: #1f6feb; color: white; }
    .btn.primary:hover { background: #1a5fd4; }
    .found-secrets { margin-top: 8px; }
    .found-secret {
      padding: 4px 8px; margin: 2px 0;
      background: rgba(248,81,73,0.15); border-radius: 4px;
      font-size: 11px; font-family: monospace;
    }
    .empty-state { color: #8b949e; text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Keyblind</h1>
    <span id="status-dot" class="status-dot red" title="Keyblind status"></span>
  </div>

  <div class="section">
    <h2>Status</h2>
    <div class="secret-count" id="secret-count">--</div>
    <div class="stat">
      <span class="stat-label">Secrets stored</span>
    </div>
    <div id="license-info" class="stat" style="display:none">
      <span class="stat-label">License</span>
      <span class="stat-value" id="license-tier"></span>
    </div>
  </div>

  <div class="section">
    <h2>Settings</h2>
    <div class="toggle-row">
      <span>Enable Extension</span>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Paste Interception</span>
      <label class="switch">
        <input type="checkbox" id="toggle-paste" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Highlight Secrets</span>
      <label class="switch">
        <input type="checkbox" id="toggle-highlight" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <h2>Current Page</h2>
    <div id="found-secrets-container" class="found-secrets"></div>
    <div id="empty-state" class="empty-state">No secrets detected on this page</div>
  </div>

  <div class="section">
    <h2>Quick Actions</h2>
    <div class="actions">
      <a class="btn primary" href="https://keyblind.dev/app" target="_blank">Dashboard</a>
      <button class="btn" id="btn-refresh">Refresh</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
