name: software beta qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: source / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Compile the Touch ID source and verify the reviewed helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          build_root=$(mktemp -d)
          trap 'rm -rf "$build_root"' EXIT
          bundle="$build_root/Keyclasp.app"
          mkdir -p "$bundle/Contents/MacOS"
          cp native/macos-biometric/Info.plist "$bundle/Contents/Info.plist"
          clang \
            -arch arm64 \
            -mmacosx-version-min=13.0 \
            -fobjc-arc \
            -framework Foundation \
            -framework AppKit \
            -framework LocalAuthentication \
            native/macos-biometric/main.m \
            -o "$bundle/Contents/MacOS/keyclasp-biometric"
          codesign --force --sign - --timestamp=none --identifier dev.keyclasp.biometric "$bundle"
          codesign --verify --strict "$bundle"
          test "$(lipo -archs "$bundle/Contents/MacOS/keyclasp-biometric")" = arm64
          codesign --verify --strict native/Keyclasp.app
          test "$(lipo -archs native/Keyclasp.app/Contents/MacOS/keyclasp-biometric)" = arm64
      - run: npm run release:inventory:check
      - name: Run the source suite
        if: runner.os != 'macOS'
        run: npm run test:source
      - name: Run the macOS source suite outside the qualification-host byte check
        if: runner.os == 'macOS'
        run: >-
          npm run test:source --
          --hookTimeout=30000
          --testNamePattern='^(?!.*ships an arm64 ad-hoc-signed Keyclasp app).*$'
      - run: git diff --check

  pack-once:
    name: reproduce the qualified rc6 package contents
    needs: source-tests
    runs-on: macos-15
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      artifact_sha256: ${{ steps.pack.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - name: Require the rc6 npm pack toolchain
        run: test "$(npm --version)" = 11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run release:inventory:check
      - id: pack
        name: Repack source and require the qualified rc6 contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          npm pack --ignore-scripts --json --pack-destination artifact > artifact/npm-pack.json
          filename=$(node -e "const r=require('./artifact/npm-pack.json')[0]; if(!r?.filename) process.exit(1); process.stdout.write(r.filename)")
          sha256=$(shasum -a 256 "artifact/$filename" | cut -d ' ' -f 1)
          node scripts/release-package-manifest.mjs \
            "artifact/$filename" \
            --check docs/releases/0.2.0-beta.1-package-manifest.json
          printf 'filename=%s\nartifact_sha256=%s\n' "$filename" "$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: software-beta-exact-tarball
          path: artifact/*
          if-no-files-found: error

  exact-tarball-tests:
    name: exact tarball / ${{ matrix.native }} / ${{ matrix.target.platform }}-${{ matrix.target.arch }} / Node ${{ matrix.node }}
    needs: pack-once
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
        node: [24, 26]
        native: [prebuilt, source]
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: software-beta-exact-tarball
          path: artifact
      - name: Verify downloaded artifact identity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.pack-once.outputs.artifact_sha256 }}
          ARTIFACT_NAME: ${{ needs.pack-once.outputs.filename }}
        run: test "$(shasum -a 256 "artifact/$ARTIFACT_NAME" | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
      - name: Exercise the installed package
        env:
          EXPECTED_SHA256: ${{ needs.pack-once.outputs.artifact_sha256 }}
          ARTIFACT_NAME: ${{ needs.pack-once.outputs.filename }}
          KEYCLASP_NATIVE_INSTALL_MODE: ${{ matrix.native }}
          EXPECTED_PLATFORM: ${{ matrix.target.platform }}
          EXPECTED_ARCH: ${{ matrix.target.arch }}
        run: node scripts/verify-packed-software-beta.mjs "artifact/$ARTIFACT_NAME"

  musl-fails-closed:
    name: exact tarball / musl unsupported / Node ${{ matrix.node }}
    needs: pack-once
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
            image: node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
          - node: 26
            image: node:26-alpine@sha256:aadf416b2cdce311a8811ba3f0608a61b77dbf997500e2eafe781b51f6a0b019
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: software-beta-exact-tarball
          path: artifact
      - name: Reject installation and stateful use on musl
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.pack-once.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.pack-once.outputs.artifact_sha256 }}
        run: >-
          docker run --rm
          -e EXPECTED_SHA256
          -v "$PWD:/work:ro"
          -w /work
          ${{ matrix.image }}
          sh scripts/verify-unsupported-unix-fail-closed.sh "artifact/$ARTIFACT_NAME" musl

  macos-x64-fails-closed:
    name: exact tarball / macOS x64 unsupported
    needs: pack-once
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: software-beta-exact-tarball
          path: artifact
      - name: Reject installation and stateful use on macOS x64
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.pack-once.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.pack-once.outputs.artifact_sha256 }}
        run: sh scripts/verify-unsupported-unix-fail-closed.sh "artifact/$ARTIFACT_NAME" macos-x64

  windows-fails-closed:
    name: exact tarball / Windows unsupported
    needs: pack-once
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: software-beta-exact-tarball
          path: artifact
      - name: Reject normal installation and stateful use
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ needs.pack-once.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.pack-once.outputs.artifact_sha256 }}
        run: ./scripts/verify-windows-fail-closed.ps1 "artifact/$env:ARTIFACT_NAME"
